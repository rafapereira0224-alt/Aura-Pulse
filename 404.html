<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Aura Pulse</title>
    <script type="text/javascript">
      // Redireciona todas as rotas 404 para o index.html mantendo o caminho para o GitHub Pages
      var pathSegmentsToKeep = 1; // Mantém o /Aura-Pulse/ na URL
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?p=/" +
          l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/") +
          (l.search ? "&" + l.search.slice(1) : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
